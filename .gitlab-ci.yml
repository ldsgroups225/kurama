stages:
  - test
  - build
  - deploy

variables:
  PNPM_VERSION: "10"
  NODE_VERSION: "22"

# Cache configuration for faster builds
.pnpm_cache:
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
      - node_modules
      - apps/*/node_modules
      - packages/*/node_modules

# Base job template
.base_job:
  image: node:${NODE_VERSION}
  before_script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - pnpm run build:packages

# Test job
test:
  extends:
    - .base_job
    - .pnpm_cache
  stage: test
  script:
    - pnpm run typecheck || echo "No typecheck script found"
    - pnpm run lint || echo "No lint script found"
    - pnpm run test || echo "No test script found"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Build job (for verification)
build:
  extends:
    - .base_job
    - .pnpm_cache
  stage: build
  script:
    - cd apps/user-application
    - pnpm run build
  artifacts:
    paths:
      - apps/user-application/dist
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Deploy Backend to Production
deploy:backend:production:
  extends:
    - .base_job
    - .pnpm_cache
  stage: deploy
  script:
    - export CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID
    - export CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN
    # Déployer les secrets avant le déploiement
    - chmod +x scripts/deploy-secrets.sh
    - ./scripts/deploy-secrets.sh backend production
    # Déployer l'application
    - cd apps/data-service
    - npx wrangler deploy
  environment:
    name: production/backend
    url: https://api.kurama.app
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Deploy Frontend to Production
deploy:frontend:production:
  extends:
    - .base_job
    - .pnpm_cache
  stage: deploy
  needs:
    - build
  script:
    - export CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID
    - export CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN
    # Déployer les secrets avant le déploiement
    - chmod +x scripts/deploy-secrets.sh
    - ./scripts/deploy-secrets.sh frontend production
    # Déployer l'application
    - cd apps/user-application
    - pnpm run build
    - npx wrangler deploy
  environment:
    name: production/frontend
    url: https://kurama.yeko.workers.dev
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Deploy Backend Preview (Merge Requests)
deploy:backend:preview:
  extends:
    - .base_job
    - .pnpm_cache
  stage: deploy
  script:
    - export CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID
    - export CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN
    # Déployer les secrets pour preview
    - chmod +x scripts/deploy-secrets.sh
    - ./scripts/deploy-secrets.sh backend preview
    # Déployer l'application
    - cd apps/data-service
    - npx wrangler deploy --env preview
  environment:
    name: preview/backend-$CI_MERGE_REQUEST_IID
    url: https://preview-api.kurama.app
    on_stop: cleanup:backend:preview
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Deploy Frontend Preview (Merge Requests)
deploy:frontend:preview:
  extends:
    - .base_job
    - .pnpm_cache
  stage: deploy
  needs:
    - build
  script:
    - export CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID
    - export CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN
    # Déployer les secrets pour preview
    - chmod +x scripts/deploy-secrets.sh
    - ./scripts/deploy-secrets.sh frontend preview
    # Déployer l'application
    - cd apps/user-application
    - pnpm run build
    - npx wrangler deploy --env preview
  environment:
    name: preview/frontend-$CI_MERGE_REQUEST_IID
    url: https://preview.kurama.yeko.workers.dev
    on_stop: cleanup:frontend:preview
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Cleanup preview environments
cleanup:backend:preview:
  extends: .base_job
  stage: deploy
  script:
    - echo "Cleaning up backend preview environment"
  environment:
    name: preview/backend-$CI_MERGE_REQUEST_IID
    action: stop
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
  variables:
    GIT_STRATEGY: none

cleanup:frontend:preview:
  extends: .base_job
  stage: deploy
  script:
    - echo "Cleaning up frontend preview environment"
  environment:
    name: preview/frontend-$CI_MERGE_REQUEST_IID
    action: stop
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
  variables:
    GIT_STRATEGY: none
